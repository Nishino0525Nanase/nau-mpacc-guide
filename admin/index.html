<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <title>站点管理 · 南审 MPAcc 指南</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body{min-height:100vh;background:#f7f6f0;color:#172d36;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
    .owner-shell{max-width:720px;margin:0 auto;padding:56px 24px}.owner-back{color:#526b70;text-decoration:none;font-size:14px}
    .owner-card{margin-top:44px;background:#fff;border:1px solid #dbe2de;border-radius:24px;padding:36px;box-shadow:0 16px 60px #172d3609}
    .owner-eyebrow{font-size:12px;letter-spacing:.16em;color:#2d7d73;font-weight:700}.owner-card h1{font-size:32px;letter-spacing:-.04em;margin:20px 0 16px}.owner-card p{line-height:1.85;color:#5b6d71}
    .owner-login{display:inline-flex;padding:14px 22px;border-radius:12px;background:#174b46;color:#fff;text-decoration:none;font-weight:650;margin:8px 0 22px}
    .owner-divider{border:0;border-top:1px solid #e5e9e6;margin:8px 0 24px}.owner-toggle{background:#f4f7f3;border:1px solid #dce5df;border-radius:10px;padding:12px 16px;cursor:pointer;font:inherit;color:#214d47}
    .owner-status{font-size:13px;min-height:28px}.owner-note{font-size:13px}.owner-card ul{padding-left:20px;color:#5b6d71;line-height:1.9}
    @media(max-width:520px){.owner-shell{padding-top:28px}.owner-card{padding:24px;margin-top:28px}.owner-card h1{font-size:27px}}
  </style>
</head>
<body>
  <main class="owner-shell">
    <a class="owner-back" href="../">← 返回南审指南</a>
    <section class="owner-card" aria-labelledby="owner-title">
      <span class="owner-eyebrow">OWNER ACCESS</span>
      <h1 id="owner-title">查看网站访问统计</h1>
      <p>使用你连接的 PostHog 账号登录，即可查看访问次数、访客数和每日趋势。统计数据保存在需要账号权限的后台，公开网页不提供读取接口。</p>
      <a class="owner-login" href="https://us.posthog.com/project/636640/dashboard/2304227" target="_blank" rel="noopener noreferrer">登录私人统计后台 ↗</a>
      <hr class="owner-divider">
      <h2 style="font-size:18px">排除自己的访问</h2>
      <p class="owner-note">在你常用的每个浏览器中点一次。设置只影响当前浏览器，此后浏览指南不再计入统计。</p>
      <button class="owner-toggle" type="button" id="exclude-self">排除这个浏览器的访问</button>
      <p class="owner-status" id="owner-status" role="status"></p>
      <hr class="owner-divider">
      <ul class="owner-note">
        <li>PV 是页面打开次数；访客数按匿名浏览器标识去重，同一人换设备可能重复计数。</li>
        <li>可在后台选择近 7 天、30 天或全部时间。统计从启用后开始，无法补记历史访问。</li>
        <li>不记录姓名、邮箱、搜索输入或页面录像；广告拦截、隐私设置和网络状况可能造成少计。</li>
      </ul>
    </section>
  </main>
  <script src="./owner.js"></script>
</body>
</html>
