  <template id="short-letter-template">
    <div class="personal-letter-copy">
            <h3>愿新的开始，顺利也从容。</h3>
            <p>胡雨诺，恭喜你保研到南审。从西南林业大学到南京读书，接下来要选导师、准备入学、了解实习，事情不少。这份指南就当作一份整理好的资料，找东西时能省些时间。</p>
            <p>愿你遇到合适的老师和实习机会，也给自己的生活留一些余地。忙完一阵，吃点应季的葡萄，回家时喝一碗熟悉的黄骨鱼汤；累了，就安心歇一歇。</p>
            <p>新的阶段，不必一下子把所有事都安排妥当。祝你按自己的节奏慢慢向前，有想争取的机会，也有踏实自在的日常。</p>
          </div>
  </template>
  <template id="quiet-letter-template">
    <h2 id="dialog-title">留在这一页</h2>
    <p class="quiet-letter-salutation">雨诺，见字好。</p>
    <p>如果你翻到了这一页，就暂时把前面的表格和链接放一放。有些零零散散的话，放在资料中间不太合适，便留在这张纸的背面。哪天空下来，慢慢读到这里，也就很好。</p>
    <p>还是想认真地说一声，恭喜你保研。一个结果落定之后，生活很快又会接上新的事情：选方向、了解老师、准备联系，想一想以后要怎么过。希望你在忙这些之前，也有过一个可以安稳高兴的时刻。过去为此付出的时间，应当得到你自己好好的一声肯定。</p>
    <p>做这份指南，最初的想法其实很简单。选导师时要看的东西很多，官网上能找到研究方向，却很难知道日常交流是什么样；帖子里能听见不同声音，又容易把本科上课、研究生指导、朋友转述和几句玩笑混在一起。把这些尽可能分开，至少能让你少绕一点路。</p>
    <p>不过，这个网站还有不少不够好的地方。有些信息只能确认一半，有些经历离现在已经很久，有些看起来肯定的话，背后其实没有说清楚过程。我更希望它像一叠可以继续补充的笔记：有出处的地方能回头查，拿不准的地方就留着问，不急着替任何人下结论。</p>
    <p>最后怎么选择，还是应该由你来定。也许你在意研究方向，也许更在意交流是否顺畅，或者希望论文、实习和自己的生活能够安排得开。这些考虑都很实际。希望你最后找到的，是一个能把问题讲清楚、遇到困难时知道往哪里求助的环境，也有适合自己的节奏。</p>
    <p>你之前提过四大、八大的实习。希望真正着手准备的时候，你能找到可靠的消息，也能遇见愿意讲一讲实际工作的人。一次投递、一次面试，或许会带来新机会，也可能只是让人更清楚下一步要准备什么。愿你慢慢找到适合自己的去处，既学到东西，也认识到自己的长处。</p>
    <p>新的阶段，大概会有不少第一次。第一次带着还不成熟的想法去交流，第一次发现一篇文章读了很久也没完全明白，第一次把一段写好的东西删掉重来。希望那些时候，你身边能有聊得来的同学、愿意讨论的伙伴，也能在忙完之后，找到一件小事让这一天好过一点。</p>
    <p>我这边也会继续准备考试，把眼前的内容一点点学清楚。看起来我们正在面对不同的事情，但认真过好一段日子，常常都是从很具体的一天开始的。今天把一道题弄懂，或者把一封邮件写好，事情未必马上有结果，做过的那一小步却不会因此消失。</p>
    <p>写这些，是想把几句祝愿说得完整一些。接下来，你的生活会被新的课程、同学和许多具体的事情慢慢填满。这份笔记就放在需要查资料时能找到的地方，至于日子怎么过，留给你自己去体会、去选择。</p>
    <p>歌单里有一首《普通到不普通的人生》，光是这个名字，就让人觉得日常也值得认真过。很多值得留下的时刻，也许并不盛大：某天终于把一件拖了很久的事做完，下课路上碰到一阵舒服的风，或者回去的途中，觉得今天虽然有点累，但还算过得不错。</p>
    <p>还有《向阳而生》。我更愿意把这几个字放回很小的生活里：白天走一段有光的路，按时吃上一顿饭，忙过一阵之后能睡个好觉。到了新环境，值得期待的事情当然不只有课题和成绩，也有以后会慢慢熟悉的街道、饭菜和属于自己的安稳。</p>
    <p>有空的时候，愿你的购物袋里也有一串合口味的葡萄。阳光玫瑰也好，别的品种也好，洗干净，放在手边，做事间隙吃上几颗。回家的时候，如果能喝上一碗热热的黄骨鱼汤，就更好了。生活里这些很小、很具体的满足，不需要有什么特别理由。</p>
    <p>等真正到了南审，书桌会慢慢有自己的样子，常走的路会越来越熟，最初需要到处查的事情，也会变成随手就能处理的日常。希望你能遇见善意，也留下自己的判断；能认真投入想做的事，又有一些时间，可以交给研究和计划以外的生活。</p>
    <p>这份指南若能在某个时刻派上一点用场，就已经很好。选课前帮你少翻几篇帖子，准备联系时帮你补上一个问题，或者需要查资料时，刚好有一条还可用的链接。以后有些内容过时了，也没有关系，它原本就是为一个具体阶段准备的，一本用过的笔记也有它的意义。</p>
    <p>写到这里，还是最普通的几句祝愿：选导师顺利，学习和实习一步步走稳，家里一切平安，身体也照顾好。等这一阵忙完，找个天气好的傍晚出去走走，或者听一会儿歌。愿你接下来的日子，有值得期待的事，也有踏实过好的每一天。</p>
    <p class="quiet-letter-closing">祝好。</p>
